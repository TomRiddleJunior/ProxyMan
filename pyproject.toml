[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyman"
version = "2.1.0"
description = "High-performance asynchronous proxy scraper and validator pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "maxminddb>=2.6,<3",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
proxyman = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]